[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = ["firebase-admin"]

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Iconițele și manifestul nu se păstrează în cache, ca schimbările de logo să ajungă pe telefoane
[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/icon*"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/apple-touch-icon.png"
  [headers.values]
    Cache-Control = "no-cache"

# Service worker-ul nu se ține în cache, ca versiunile noi să ajungă imediat
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
