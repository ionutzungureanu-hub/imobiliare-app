[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Iconițele și manifestul nu se păstrează în cache, ca schimbările de logo să ajungă pe telefoane
[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/icon*"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/apple-touch-icon.png"
  [headers.values]
    Cache-Control = "no-cache"
